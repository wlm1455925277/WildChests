# Only sent to operators
AUTO_SAVE: $<p:wildchests_prefix>已保存所有数据库]

# Called when a player runs a command not in the required usage
COMMAND_USAGE: $<p:wildchests_prefix>&7用法：/{0}

# Called when using /chests give command.
CHEST_GIVE_PLAYER: $<p:wildchests_prefix>&7已成功给予 {2} x{1} 给 {0}。
CHEST_RECIEVE: $<p:wildchests_prefix>&7你收到了来自 {2} 的 x{0} {1}。

# Called when using /chests info command.
CHEST_INFO_HEADER: '&8&m---------------&e&l 超级箱子 &8&m---------------'
CHEST_INFO_NAME: '&5 箱子名称&7：&f{0}'
CHEST_INFO_TYPE: '&5 类型&7：&f{0}'
CHEST_INFO_SIZE: '&5 默认容量&7：&f{0}'
CHEST_INFO_DEFAULT_TITLE: '&5 默认标题&7：&f{0}'
CHEST_INFO_SELL_MODE: '&5 售卖模式&7：&f{0}'
CHEST_INFO_RECIPES: '&5 合成配方&7：&f{0}'
CHEST_INFO_FOOTER: '&8&m---------------&5&l 超级箱子 &8&m---------------'

# Called when a chest is placed down.
CHEST_PLACED: $<p:wildchests_prefix>&7你放置了一个 {0}。

# Called when crafting items in auto-crafter
CRAFTED_ITEMS_HEADER: $<p:wildchests_prefix>&7你合成了以下物品：
CRAFTED_ITEMS_LINE: $<p:wildchests_prefix>&7x{0} {1}
CRAFTED_ITEMS_FOOTER: $<p:wildchests_prefix>&7本次共合成 {0} 件物品

# Called when upgrading a chest
EXPAND_CHEST: |-
  $<p:wildchests_prefix>&7你将以 ${0} 购买一次容量扩展
  $<p:wildchests_prefix>&7若要继续，请输入 &a&lCONFIRM&7。
EXPAND_PURCHASED: $<p:wildchests_prefix>&7已成功为你的箱子购买容量扩展！
EXPAND_FAILED: $<p:wildchests_prefix>&7正在尝试打开箱子……
EXPAND_FAILED_CHEST_BROKEN: $<p:wildchests_prefix>&7世界中已找不到该箱子。

# Format for sell-format
FORMAT_QUAD: Q
FORMAT_TRILLION: T
FORMAT_BILLION: B
FORMAT_MILLION: M
FORMAT_THOUSANDS: K

# Called when a player runs an invalid chests sub-command.
HELP_COMMAND_HEADER: '&8&m---------------&e&l 超级箱子 &8&m---------------'
HELP_COMMAND_LINE: '&7- &5/{0} &8- &f{1}'
HELP_COMMAND_FOOTER: '&8&m---------------&e&l 超级箱子 &8&m---------------'

# Called when a player runs give command with an invalid argument.
INVALID_PLAYER: $<p:wildchests_prefix>&7未找到名为 {0} 的玩家。
INVALID_CHEST: $<p:wildchests_prefix>&7未找到名为 {0} 的箱子类型。
INVALID_AMOUNT: $<p:wildchests_prefix>&7请输入一个有效的数字。

# Called when using /chests link command
INVALID_BLOCK_CHEST: $<p:wildchests_prefix>&7未找到有效的可链接箱子。
LINKED_SUCCEED: $<p:wildchests_prefix>&7已将箱子 [{0}] 成功链接到此箱子。
NOT_LINKED_CHEST: $<p:wildchests_prefix>&7此箱子不支持被链接。
SELECT_ANOTHER_CHEST: $<p:wildchests_prefix>&7请使用 /chests link 选择另一个要链接的箱子。
LEFTOVERS_ITEMS_WARNING: $<p:wildchests_prefix>&7箱内有残留物品，已转移到被链接的箱子中。

# Called when logging on and received money while being offline
MONEY_EARNED_OFFLINE: $<p:wildchests_prefix>&7你在离线期间共获得 ${0}！

# Called when running a chests command without permission.
NO_PERMISSION: '&f未知的指令。输入 "/help" 查看帮助。'

# Called when a player successfully reloaded all configuration files.
RELOAD_SUCCESS: $<p:wildchests_prefix>&7已成功重载配置文件。

# Called when selling items into sell-chest
SOLD_CHEST_HEADER: $<p:wildchests_prefix>&7你在最近 10 分钟内的交易：
SOLD_CHEST_LINE: $<p:wildchests_prefix>&7x{0} {1} 售出获得 ${2}
SOLD_CHEST_FOOTER: $<p:wildchests_prefix>&7你总共获得了 ${0}